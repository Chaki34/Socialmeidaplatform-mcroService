<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialConnect Pro | Professional Social Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        /* [STYLES PRESERVED - NO CHANGES] */
        :root { --primary: #6366f1; --primary-glow: rgba(99, 102, 241, 0.4); --accent: #f43f5e; --dark-bg: #0f172a; --glass: rgba(255, 255, 255, 0.05); --glass-heavy: rgba(15, 23, 42, 0.8); --glass-border: rgba(255, 255, 255, 0.1); --text-main: #f8fafc; --text-dim: #94a3b8; --nav-width: 260px; --story-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--dark-bg); color: var(--text-main); overflow: hidden; height: 100vh; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .app-container { display: flex; height: 100vh; max-width: 1600px; margin: 0 auto; position: relative; }
        nav.sidebar { width: var(--nav-width); padding: 2rem 1.5rem; display: flex; flex-direction: column; border-right: 1px solid var(--glass-border); background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(15px); z-index: 100; }
        .logo { font-weight: 800; font-size: 1.6rem; margin-bottom: 2.5rem; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 12px; }
        .nav-links { list-style: none; flex: 1; }
        .nav-item { padding: 0.8rem 1rem; margin-bottom: 0.4rem; border-radius: 12px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 15px; color: var(--text-dim); font-weight: 600; }
        .nav-item:hover, .nav-item.active { background: var(--glass); color: var(--text-main); }
        .nav-item.active i { color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }
        main.content-area { flex: 1; overflow-y: auto; scrollbar-width: none; padding: 2rem; display: flex; justify-content: center; }
        .feed-container { width: 100%; max-width: 650px; }
        .stories-bar { display: flex; gap: 18px; padding-bottom: 2rem; overflow-x: auto; scrollbar-width: none; }
        .story-card { min-width: 75px; text-align: center; cursor: pointer; }
        .story-ring { width: 70px; height: 70px; border-radius: 50%; padding: 3px; background: var(--story-gradient); margin-bottom: 6px; }
        .story-ring img { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--dark-bg); object-fit: cover; }
        .post-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; margin-bottom: 2rem; overflow: hidden; backdrop-filter: blur(10px); }
        .post-header { padding: 1.2rem; display: flex; align-items: center; justify-content: space-between; }
        .user-meta { display: flex; align-items: center; gap: 12px; }
        .user-meta img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--primary); }
        .post-media { width: 100%; position: relative; background: #000; min-height: 300px; }
        .post-media img { width: 100%; max-height: 700px; object-fit: contain; }
        .post-actions { padding: 1rem 1.2rem; display: flex; gap: 20px; font-size: 1.5rem; }
        .post-details { padding: 0 1.2rem 1.2rem; }
        .right-sidebar { width: 380px; padding: 2rem; }
        .user-profile-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 1.5rem; text-align: center; }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--primary); margin: 0 auto 1rem; object-fit: cover; }
        @media (max-width: 1100px) { .right-sidebar { display: none; } }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="app-container">
    <nav class="sidebar">
        <div class="logo"><i class="fa-solid fa-bolt"></i> ConnectPro</div>
        <ul class="nav-links">
            <li class="nav-item active"><i class="fa-solid fa-house"></i> <span>Feed</span></li>
            <li class="nav-item"><i class="fa-solid fa-compass"></i> <span>Explore</span></li>
            <li class="nav-item"><i class="fa-solid fa-paper-plane"></i> <span>Messages</span></li>
            <li class="nav-item"><i class="fa-solid fa-circle-user"></i> <span>Profile</span></li>
        </ul>
        <button onclick="window.location.href='/setup'" style="background: var(--primary); border:none; color:white; padding: 1rem; border-radius: 15px; cursor:pointer; font-weight:bold; margin-top:1rem;">
            <i class="fa-solid fa-square-plus"></i> <span>Create Account</span>
        </button>
    </nav>

    <main class="content-area">
        <div class="feed-container">
            <div class="stories-bar" id="story-list"></div>
            <div id="posts-feed"></div>
        </div>
    </main>

    <aside class="right-sidebar">
        <div class="user-profile-card" id="mini-profile">
            <img src="https://via.placeholder.com/150" class="profile-avatar">
            <h2>Welcome</h2>
            <p style="color: var(--text-dim);">Sign in to see more</p>
        </div>
    </aside>
</div>

<script>
    /* PRESERVED THREE.JS LOGIC */
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    const particlesGeometry = new THREE.BufferGeometry();
    const posArr = new Float32Array(4500);
    for(let i=0; i<4500; i++) posArr[i] = (Math.random()-0.5)*10;
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    const material = new THREE.PointsMaterial({ size: 0.015, color: 0x6366f1 });
    const particlesMesh = new THREE.Points(particlesGeometry, material);
    scene.add(particlesMesh); camera.position.z = 5;
    function animate(){ requestAnimationFrame(animate); particlesMesh.rotation.y += 0.001; renderer.render(scene, camera); }
    animate();

    /* DYNAMIC FEED LOGIC */
    async function loadFeed() {
        try {
            const res = await fetch('/ui/users/all');
            const users = await res.json();

            const storyList = document.getElementById('story-list');
            const postFeed = document.getElementById('posts-feed');

            storyList.innerHTML = '';
            postFeed.innerHTML = '';

            users.forEach(user => {
                const imgPath = user.profileImage || 'https://via.placeholder.com/150';

                // Add to Stories
                storyList.innerHTML += `
                    <div class="story-card">
                        <div class="story-ring"><img src="${imgPath}"></div>
                        <span>${user.firstName}</span>
                    </div>
                `;

                // Add to Post Feed
                postFeed.innerHTML += `
                    <article class="post-card">
                        <div class="post-header">
                            <div class="user-meta">
                                <img src="${imgPath}">
                                <div class="meta-info">
                                    <div class="name">${user.firstName} ${user.lastName} <i class="fa-solid fa-circle-check" style="color: #0ea5e9;"></i></div>
                                    <div class="loc">${user.city || 'Earth'}, ${user.country || 'Universe'}</div>
                                </div>
                            </div>
                            <i class="fa-solid fa-ellipsis"></i>
                        </div>
                        <div class="post-media">
                            <img src="${imgPath}">
                        </div>
                        <div class="post-actions">
                            <i class="fa-regular fa-heart"></i>
                            <i class="fa-regular fa-comment"></i>
                            <i class="fa-regular fa-paper-plane"></i>
                        </div>
                        <div class="post-details">
                            <div class="caption"><b>${user.username}</b> ${user.bio || 'Hello everyone! I just joined ConnectPro.'}</div>
                        </div>
                    </article>
                `;
            });

            // Update Right Sidebar with the first user for demo
            if(users.length > 0) {
                const u = users[0];
                document.getElementById('mini-profile').innerHTML = `
                    <img src="${u.profileImage}" class="profile-avatar">
                    <h2>${u.firstName}</h2>
                    <p>@${u.username}</p>
                    <div style="margin-top:1rem; border-top:1px solid var(--glass-border); padding-top:10px;">
                        <b>${u.country}</b> | ${u.gender}
                    </div>
                `;
            }
        } catch (err) { console.error("Failed to load users", err); }
    }

    loadFeed();
</script>
</body>
</html>
