<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexus | Premium Account Setup</title>

    <!-- Fonts & Icons (Switched to Inter to match Landing Page) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            /* FLEXUS COLOR PALETTE */
            --primary: #E30613; /* Flexus Red */
            --primary-glow: rgba(227, 6, 19, 0.2);
            --accent-yellow: #FFD200; /* Flexus Yellow */
            --secondary: #555555; /* Muted Text */
            --dark: #0f111a; /* Dark Navy from Footer */
            --glass: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(0, 0, 0, 0.08);
            /* Multi-color gradient reflecting the logo boxes */
            --logo-gradient: linear-gradient(90deg, #E30613 0%, #4CAF50 33%, #2196F3 66%, #FFC107 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: #ffffff; /* Lighter background to let Three.js breathe */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        #canvas-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: #f8f9fa;
        }

        /* App Card - Frosted Glass from Landing Page */
        .app-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 900px;
            border-radius: 12px; /* Sharper corners like Landing Page buttons */
            border: 1px solid var(--glass-border);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        /* Multi-color Progress Bar */
        .progress-bar { height: 5px; background: rgba(0,0,0,0.05); width: 100%; }
        #progress-fill {
            height: 100%;
            background: var(--logo-gradient);
            width: 33%;
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .section { display: none; padding: 4rem; animation: fadeIn 0.6s ease-out; }
        .section.active { display: grid; grid-template-columns: 1fr 1fr; gap: 3.5rem; align-items: center; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-size: 2.8rem; color: var(--dark); font-weight: 500; line-height: 1.1; margin-bottom: 1rem; letter-spacing: -1px; }
        .subtitle { color: var(--secondary); margin-bottom: 2rem; font-size: 1.1rem; line-height: 1.6; }

        .field-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--dark); margin-bottom: 0.6rem; text-transform: uppercase; letter-spacing: 1px; }

        input, select, textarea {
            width: 100%; padding: 0.9rem 1rem; border-radius: 4px; border: 1.5px solid #EAEAEA;
            background: #fff; font-size: 0.95rem; transition: 0.2s; outline: none;
            color: var(--dark);
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .section-visual {
            background: #f3f4f6; height: 100%; min-height: 450px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
        }
        .section-visual img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(20%); transition: 0.5s; }
        .section-visual:hover img { filter: grayscale(0%); transform: scale(1.05); }

        .upload-zone {
            border: 2px dashed #ddd; border-radius: 8px; padding: 2rem;
            text-align: center; cursor: pointer; transition: 0.3s;
        }
        .upload-zone:hover { border-color: var(--primary); background: rgba(227, 6, 19, 0.02); }

        .preview-circle {
            width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 1.2rem;
            background: #f8f9fa; display: flex; align-items: center; justify-content: center;
            overflow: hidden; font-size: 2rem; color: #ccc;
            border: 1px solid #eee;
        }
        .preview-circle img { width: 100%; height: 100%; object-fit: cover; }

        /* Button styling matching the Landing Page CTA */
        .btn {
            padding: 14px 28px; border-radius: 4px; border: none; font-weight: 700;
            cursor: pointer; transition: all 0.3s; font-size: 14px;
            text-transform: uppercase; letter-spacing: 1px;
            display: inline-flex; align-items: center; justify-content: center; gap: 0.8rem;
        }
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-primary:hover { background: #c20511; transform: translateY(-2px); box-shadow: 0 5px 15px var(--primary-glow); }

        .btn-secondary { background: white; color: var(--dark); border: 1px solid #ddd; width: 100%; }
        .btn-secondary:hover { background: #f8f9fa; }

        .btn-danger { background: #fff; color: var(--primary); border: 1px solid #fee2e2; width: 100%; }
        .btn-danger:hover { background: #fff1f2; }

        #error-banner {
            display: none; background: #E30613; color: white;
            padding: 12px 24px; position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; border-radius: 4px; font-weight: 600; font-size: 14px;
        }

        /* Profile View Styling */
        #step-3.active { display: block; text-align: center; max-width: 700px; margin: 0 auto; }
        /* Fix for the Gradient Banner */
.view-banner {
    height: 140px;
    background: var(--logo-gradient);
    border-radius: 8px 8px 0 0; /* Sharp top corners */
    margin: -4rem -4rem -70px -4rem; /* Negative margins to stretch to the card edges */
    position: relative;
    z-index: 1; /* Lower layer */
}

/* Fix for the Profile Avatar layering */
#view-avatar {
    width: 130px;
    height: 130px;
    margin: 0 auto;
    position: relative;
    z-index: 5; /* Higher layer to stay ABOVE banner */
    border: 6px solid white;
    background: white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}
        .pill { background: #f3f4f6; padding: 0.5rem 1rem; border-radius: 4px; font-size: 12px; font-weight: 700; color: #555; text-transform: uppercase; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .loader { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.3); border-top: 2.5px solid white; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 850px) {
            .section.active { grid-template-columns: 1fr; padding: 2.5rem; }
            .section-visual { display: none; }
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>
<div id="error-banner"></div>

<div class="app-card">
    <div class="progress-bar"><div id="progress-fill"></div></div>

    <!-- STEP 0: LOGIN VIEW -->
    <div id="step-0" class="section">
        <div class="section-content">
            <h1>Welcome back.</h1>
            <p class="subtitle">Access your professional dashboard and network.</p>
            <form id="form-login">
                <div class="field-group">
                    <label>Username</label>
                    <input type="text" id="login-username" placeholder="e.g. @alex_creators" required>
                </div>
                <div class="field-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    <span>Sign In</span>
                    <i class="fa-solid fa-right-to-bracket"></i>
                </button>
                <div style="margin-top: 1.5rem; text-align: center;">
                    <a href="javascript:void(0)" onclick="toggleStep(1)" style="color: var(--secondary); text-decoration: none; font-size: 13px;">
                        New to Flexus? <b style="color: var(--primary)">Create an account</b>
                    </a>
                </div>
            </form>
        </div>
        <div class="section-visual">
            <img src="https://images.unsplash.com/photo-1432888498266-38ffec3eaf0a?auto=format&fit=crop&w=800&q=80" alt="Login">
        </div>
    </div>

    <!-- STEP 1 -->
    <div id="step-1" class="section active">
        <div class="section-content">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:20px;">
                <div style="width:10px; height:10px; background:#E30613;"></div>
                <span style="font-weight:800; font-size:12px; letter-spacing:2px; color:#888;">FLEXUS SETUP</span>
            </div>
            <h1>Start your journey.</h1>
            <p class="subtitle">Join thousands of professionals on Flexus.</p>
            <form id="form-create">
                <div class="field-group">
                    <label>Unique Username</label>
                    <input type="text" id="reg-username" placeholder="@username" required minlength="3">
                </div>
                <div class="field-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" placeholder="••••••••" required>
                </div>
                <div class="field-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" placeholder="name@company.com" required>
                </div>
                <div class="field-group">
                    <label>Phone Number</label>
                    <input type="tel" id="reg-phone" placeholder="+1 (555) 000-0000">
                </div>
                <button type="submit" class="btn btn-primary">
                    <span>Create Account</span>
                    <i class="fa-solid fa-arrow-right"></i>
                    <div class="loader"></div>
                </button>
                <div style="margin-top: 1.5rem; text-align: center;">
                    <p style="color: var(--secondary); font-size: 13px;">
                        Already have an account?
                        <a href="javascript:void(0)" onclick="redirectToLogin()" style="color: var(--primary); font-weight: 700; text-decoration: none;">
                            Login Here
                        </a>
                    </p>
                </div>
            </form>
        </div>
        <div class="section-visual">
            <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=800&q=80" alt="Social">
        </div>
    </div>

    <!-- STEP 2 -->
    <div id="step-2" class="section">
        <div class="section-visual">
            <img src="https://images.unsplash.com/photo-1517048676732-d65bc937f952?auto=format&fit=crop&w=800&q=80" alt="Team">
        </div>
        <div class="section-content">
            <h1>Personalize.</h1>
            <p class="subtitle">Complete your profile to increase visibility.</p>
            <form id="form-setup">
                <div class="field-group" style="margin-bottom: 2rem;">
                    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                        <div class="preview-circle" id="image-preview"><i class="fa-solid fa-user"></i></div>
                        <p style="font-weight: 700; font-size: 11px; color: var(--primary); letter-spacing: 1px;">UPLOAD PHOTO</p>
                        <input type="file" id="fileInput" hidden accept="image/*">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="field-group"><label>First Name</label><input type="text" id="setup-fname" required></div>
                    <div class="field-group"><label>Last Name</label><input type="text" id="setup-lname" required></div>
                </div>

                <div class="grid-2">
                    <div class="field-group">
                        <label>Gender</label>
                        <select id="setup-gender">
                            <option value="MALE">Male</option>
                            <option value="FEMALE">Female</option>
                            <option value="OTHER">Other</option>
                        </select>
                    </div>
                    <div class="field-group"><label>Birth Date</label><input type="date" id="setup-dob"></div>
                </div>

                <div class="grid-2">
                    <div class="field-group"><label>Country</label><input type="text" id="setup-country" placeholder="USA"></div>
                    <div class="field-group"><label>City</label><input type="text" id="setup-city" placeholder="New York"></div>
                </div>

                <input type="hidden" id="setup-state">
                <input type="hidden" id="setup-lang" value="English">

                <div class="field-group">
                    <label>Professional Bio</label>
                    <textarea id="setup-bio" rows="2" placeholder="Brief description of your skills..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span>Finish Setup</span>
                    <i class="fa-solid fa-check"></i>
                    <div class="loader"></div>
                </button>
            </form>
        </div>
    </div>

    <!-- STEP 3 -->
    <div id="step-3" class="section">
        <div class="profile-header">
            <div class="view-banner"></div>
            <div class="preview-circle" id="view-avatar" style="width: 120px; height: 120px; margin-top: -60px; border: 5px solid white;"></div>
            <h1 id="view-name" style="margin-top: 1rem; margin-bottom: 0.2rem;"></h1>
            <p id="view-handle" style="color: var(--primary); font-weight: 700; font-size: 1rem;"></p>
            <div style="display: flex; justify-content: center; gap: 8px; margin: 1.5rem 0; flex-wrap: wrap;" id="view-pills"></div>
        </div>

        <div style="background: #fdfdfd; padding: 2rem; border-radius: 8px; margin-bottom: 2.5rem; text-align: left; border: 1px solid #eee;">
            <label style="color: #999;">BIO</label>
            <p id="view-bio" style="font-size: 1rem; line-height: 1.6; color: var(--dark);"></p>
        </div>

        <div class="profile-actions" style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 0.8rem;">
            <button onclick="startApp()" class="btn btn-primary">Launch Flexus</button>
            <button onclick="showUpdate()" class="btn btn-secondary">Edit</button>
            <button onclick="confirmDelete()" class="btn btn-danger">Delete</button>
        </div>
    </div>
</div>

<script>
    /* UPDATED THREE.JS LOGIC TO MATCH BRAND RED */
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const particlesGeometry = new THREE.BufferGeometry();
    const posArr = new Float32Array(1200 * 3);
    for(let i = 0; i < 3600; i++) { posArr[i] = (Math.random() - 0.5) * 10; }
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArr, 3));

    const material = new THREE.PointsMaterial({
        size: 0.015,
        color: 0xE30613 // Changed to Flexus Red
    });

    const particlesMesh = new THREE.Points(particlesGeometry, material);
    scene.add(particlesMesh);

    const shapes = [];
    const geometry = new THREE.IcosahedronGeometry(0.15, 0);

    for(let i=0; i<10; i++){
        const mat = new THREE.MeshPhongMaterial({
            color: i % 2 === 0 ? 0xE30613 : 0x4CAF50, // Red and Green particles
            wireframe: true,
            transparent: true,
            opacity: 0.2
        });
        const mesh = new THREE.Mesh(geometry, mat);
        mesh.position.set((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
        scene.add(mesh);
        shapes.push(mesh);
    }

    const light = new THREE.PointLight(0xffffff, 1);
    light.position.set(2, 3, 5);
    scene.add(light, new THREE.AmbientLight(0xffffff, 0.7));
    camera.position.z = 5;

    function animate(){
        requestAnimationFrame(animate);
        particlesMesh.rotation.y += 0.0005;
        shapes.forEach(shape => {
            shape.rotation.x += 0.01;
            shape.rotation.y += 0.01;
            shape.position.y += Math.sin(Date.now() * 0.001) * 0.001;
        });
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* EXISTING APPLICATION LOGIC (UNTOUCHED) */
    let currentUserUuid = null;
    let base64Image = "";
    const API_BASE = '/ui/users';
    const savedUserUuid = localStorage.getItem("currentUserUuid");
    if(savedUserUuid){ currentUserUuid = savedUserUuid; }

    const toggleStep = (step) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(`step-${step}`).classList.add('active');
        document.getElementById('progress-fill').style.width = step === 1 ? '33%' : step === 2 ? '66%' : step === 3 ? '100%' : '0%';
    };

    const setBtnLoading = (step, isLoading) => {
        const btn = document.querySelector(`#step-${step} button[type="submit"]`);
        if(!btn) return;
        btn.disabled = isLoading;
        if(btn.querySelector('span')) btn.querySelector('span').style.display = isLoading ? 'none' : 'block';
        if(btn.querySelector('i')) btn.querySelector('i').style.display = isLoading ? 'none' : 'block';
        if(btn.querySelector('.loader')) btn.querySelector('.loader').style.display = isLoading ? 'block' : 'none';
    };

    const showError = (msg) => {
        const banner = document.getElementById('error-banner');
        banner.innerText = msg;
        banner.style.display = 'block';
        setTimeout(() => banner.style.display = 'none', 5000);
    };

    document.getElementById('fileInput').addEventListener('change', function(e){
        const file = e.target.files[0];
        if(file){
            const reader = new FileReader();
            reader.onload = (event) => {
                const fullBase64 = event.target.result;
                base64Image = fullBase64.split(',')[1];
                document.getElementById('image-preview').innerHTML = `<img src="${fullBase64}">`;
            };
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('form-create').onsubmit = async (e) => {
        e.preventDefault();
        setBtnLoading(1, true);
        try {
            const res = await fetch(API_BASE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('reg-username').value,
                    password: document.getElementById('reg-password').value,
                    email: document.getElementById('reg-email').value,
                    phoneNumber: document.getElementById('reg-phone').value
                })
            });
            const data = await res.json();
            if(res.ok){
                currentUserUuid = data.userUuid;
                localStorage.setItem("currentUserUuid", currentUserUuid);
                toggleStep(2);
            } else { showError(data.message || "Failed"); }
        } catch(error){ showError("Server connection error"); }
        finally { setBtnLoading(1, false); }
    };

    document.getElementById('form-setup').onsubmit = async (e) => {
        e.preventDefault();
        setBtnLoading(2, true);
        try {
            const res = await fetch(`${API_BASE}/${currentUserUuid}/profile`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    firstName: document.getElementById('setup-fname').value,
                    lastName: document.getElementById('setup-lname').value,
                    bio: document.getElementById('setup-bio').value,
                    gender: document.getElementById('setup-gender').value,
                    dateOfBirth: document.getElementById('setup-dob').value,
                    country: document.getElementById('setup-country').value,
                    city: document.getElementById('setup-city').value,
                    state: "N/A",
                    language: "English",
                    profileImage: base64Image
                })
            });
            const data = await res.json();
            if(res.ok){
                renderProfile(data);
                toggleStep(3);
            } else { showError("Setup failed"); }
        } catch(error){ showError("Server error"); }
        finally { setBtnLoading(2, false); }
    };

    const renderProfile = (user) => {
        document.getElementById('view-name').innerText = `${user.firstName || ""} ${user.lastName || ""}`;
        document.getElementById('view-handle').innerText = `@${user.username || ""}`;
        document.getElementById('view-bio').innerText = user.bio || "No bio provided.";
        const avatar = document.getElementById('view-avatar');
        if(user.profileImage && user.profileImage.trim() !== ""){
            let imageUrl = user.profileImage.startsWith("http") ? user.profileImage : window.location.origin + user.profileImage;
            avatar.innerHTML = `<img src="${imageUrl}" style="width:100%; height:100%; object-fit:cover;">`;
        } else {
            avatar.innerHTML = `<i class="fa-solid fa-user"></i>`;
        }
        document.getElementById('view-pills').innerHTML = `
            <div class="pill"><i class="fa-solid fa-earth-americas"></i> ${user.country || "Global"}</div>
            <div class="pill"><i class="fa-solid fa-mars-double"></i> ${user.gender || "Not Set"}</div>
            <div class="pill" style="color:var(--primary);"><i class="fa-solid fa-circle-check"></i> Verified Member</div>
        `;
    };

    function showUpdate(){ toggleStep(2); }
    function startApp(){
        const uuid = localStorage.getItem("currentUserUuid");
        if(!uuid){ showError("User session missing"); return; }
        window.location.href="/feed";
    }
    async function confirmDelete(){
        if(confirm("Permanently delete profile?")){
            await fetch(`${API_BASE}/${localStorage.getItem("currentUserUuid")}`, { method:'DELETE' });
            localStorage.removeItem("currentUserUuid");
            location.reload();
        }
    }
    function redirectToLogin() { toggleStep(0); }

    document.getElementById('form-login').onsubmit = async (e) => {
        e.preventDefault();
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;
        try {
            const res = await fetch('/ui/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem("currentUserUuid", data.userUuid);
                window.location.href = "/feed";
            } else { showError("Invalid credentials"); }
        } catch (error) { showError("Connection error"); }
    };
</script>
</body>
</html>
