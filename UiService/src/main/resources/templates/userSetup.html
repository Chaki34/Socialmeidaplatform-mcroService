<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialConnect | Premium Account Setup</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        /* [STYLES PRESERVED EXACTLY] */
        :root { --primary: #6366f1; --primary-glow: rgba(99, 102, 241, 0.5); --accent: #f43f5e; --secondary: #64748b; --dark: #0f172a; --glass: rgba(255, 255, 255, 0.9); --glass-border: rgba(255, 255, 255, 0.5); --gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; padding: 20px; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
        .app-card { background: var(--glass); backdrop-filter: blur(15px); width: 100%; max-width: 900px; border-radius: 2.5rem; border: 1px solid var(--glass-border); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); overflow: hidden; position: relative; z-index: 10; }
        .progress-bar { height: 8px; background: rgba(0,0,0,0.05); width: 100%; }
        #progress-fill { height: 100%; background: var(--gradient); width: 33%; transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .section { display: none; padding: 3.5rem; animation: fadeIn 0.6s ease-out; }
        .section.active { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        h1 { font-size: 2.5rem; color: var(--dark); font-weight: 800; line-height: 1.1; margin-bottom: 1rem; }
        .subtitle { color: var(--secondary); margin-bottom: 2rem; font-size: 1.1rem; }
        .field-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--dark); margin-bottom: 0.6rem; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 1rem; border-radius: 1rem; border: 2px solid #e2e8f0; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }
        .section-visual { background: var(--gradient); height: 100%; min-height: 400px; border-radius: 2rem; overflow: hidden; }
        .section-visual img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .upload-zone { border: 2px dashed var(--primary); border-radius: 1.5rem; padding: 2rem; text-align: center; cursor: pointer; background: rgba(99, 102, 241, 0.05); }
        .preview-circle { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 1rem; background: #f8fafc; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 4px solid white; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .preview-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .btn { padding: 1rem 2rem; border-radius: 1.2rem; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 0.8rem; }
        .btn-primary { background: var(--gradient); color: white; width: 100%; }
        .btn-secondary { background: white; color: var(--dark); border: 2px solid #e2e8f0; width: 100%; }
        .btn-danger { background: #fff1f2; color: var(--accent); border: 2px solid #fee2e2; width: 100%; }
        #error-banner { display: none; background: #fff1f2; border-left: 5px solid var(--accent); padding: 1rem; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; border-radius: 1rem; color: #991b1b; width: 90%; max-width: 400px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        #step-3.active { display: block; text-align: center; max-width: 800px; margin: 0 auto; }
        .view-banner { height: 150px; background: var(--gradient); border-radius: 2rem; margin-bottom: -60px; }
        .pill { background: white; padding: 0.6rem 1.2rem; border-radius: 50px; font-size: 0.85rem; font-weight: 700; color: var(--secondary); box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: inline-flex; align-items: center; gap: 5px; }

        /* New Community List Styling */
        .community-section { margin-top: 4rem; text-align: left; border-top: 2px solid #e2e8f0; padding-top: 2rem; }
        .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
        .user-card { background: white; padding: 1.2rem; border-radius: 1.5rem; border: 1px solid #e2e8f0; text-align: center; }
        .user-card img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin-bottom: 0.5rem; border: 2px solid var(--primary); }
    </style>
</head>
<body>

<div id="canvas-container"></div>
<div id="error-banner"></div>

<div class="app-card">
    <div class="progress-bar"><div id="progress-fill"></div></div>

    <!-- STEP 1: CREATE -->
    <div id="step-1" class="section active">
        <div class="section-content">
            <h1>Start Your Journey.</h1>
            <p class="subtitle">Join our professional network today.</p>
            <form id="form-create">
                <div class="field-group"><label>Unique Username</label><input type="text" id="reg-username" placeholder="@username" required minlength="3"></div>
                <div class="field-group"><label>Email Address</label><input type="email" id="reg-email" placeholder="name@company.com" required></div>
                <div class="field-group"><label>Phone Number</label><input type="tel" id="reg-phone" placeholder="+1 (555) 000-0000" required></div>
                <button type="submit" class="btn btn-primary">Create My Account <i class="fa-solid fa-arrow-right"></i></button>
            </form>
        </div>
        <div class="section-visual"><img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=800&q=80"></div>
    </div>

    <!-- STEP 2: SETUP -->
    <div id="step-2" class="section">
        <div class="section-visual"><img src="https://images.unsplash.com/photo-1517048676732-d65bc937f952?auto=format&fit=crop&w=800&q=80"></div>
        <div class="section-content">
            <h1>Personalize.</h1>
            <p class="subtitle">Let the world know who you are.</p>
            <form id="form-setup">
                <div class="field-group">
                    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                        <div class="preview-circle" id="image-preview"><i class="fa-solid fa-user" style="font-size: 2.5rem; color: #cbd5e1;"></i></div>
                        <p style="font-weight: 800; font-size: 0.8rem; color: var(--primary);">UPLOAD PROFILE IMAGE</p>
                        <input type="file" id="fileInput" hidden accept="image/*">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="field-group"><label>First Name</label><input type="text" id="setup-fname" required></div>
                    <div class="field-group"><label>Last Name</label><input type="text" id="setup-lname" required></div>
                </div>
                <div class="grid-2">
                    <div class="field-group"><label>Gender</label><select id="setup-gender"><option value="MALE">Male</option><option value="FEMALE">Female</option><option value="OTHER">Other</option></select></div>
                    <div class="field-group"><label>Birth Date</label><input type="date" id="setup-dob" required></div>
                </div>
                <div class="grid-2">
                    <div class="field-group"><label>Country</label><input type="text" id="setup-country" required></div>
                    <div class="field-group"><label>City</label><input type="text" id="setup-city" required></div>
                </div>
                <div class="field-group"><label>Professional Bio</label><textarea id="setup-bio" rows="2" placeholder="Tell us about yourself..." required></textarea></div>
                <button type="submit" class="btn btn-primary">Finish Setup <i class="fa-solid fa-check-circle"></i></button>
            </form>
        </div>
    </div>

    <!-- STEP 3: FINISHED & COMMUNITY -->
    <div id="step-3" class="section">
        <div class="profile-header">
            <div class="view-banner"></div>
            <div class="preview-circle" id="view-avatar"></div>
            <h1 id="view-name" style="margin-top: 1rem; margin-bottom: 0.2rem;"></h1>
            <p id="view-handle" style="color: var(--primary); font-weight: 800; font-size: 1.2rem;"></p>
            <div style="display: flex; justify-content: center; gap: 10px; margin: 1.5rem 0; flex-wrap: wrap;" id="view-pills"></div>
        </div>
        <div style="background: white; padding: 2rem; border-radius: 1.5rem; margin-bottom: 2.5rem; text-align: left; border: 1px solid #e2e8f0;">
            <label style="color: var(--secondary);">About Me</label>
            <p id="view-bio" style="font-size: 1.1rem; line-height: 1.6; color: var(--dark);"></p>
        </div>
        <div class="profile-actions" style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1rem;">
            <button onclick="window.location.href='/feed'" class="btn btn-primary"><i class="fa-solid fa-rocket"></i> Launch Feed</button>
            <button onclick="toggleStep(2)" class="btn btn-secondary">Edit</button>
            <button onclick="confirmDelete()" class="btn btn-danger">Delete</button>
        </div>

    </div>
</div>

<script>
    /* THREE.JS BACKGROUND */
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const particlesGeometry = new THREE.BufferGeometry();
    const posArr = new Float32Array(3000);

    for (let i = 0; i < 3000; i++) {
        posArr[i] = (Math.random() - 0.5) * 10;
    }

    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArr, 3));

    const particlesMesh = new THREE.Points(
        particlesGeometry,
        new THREE.PointsMaterial({
            size: 0.015,
            color: 0x6366f1
        })
    );

    scene.add(particlesMesh);

    camera.position.z = 5;

    function animate() {
        requestAnimationFrame(animate);
        particlesMesh.rotation.y += 0.001;
        renderer.render(scene, camera);
    }

    animate();

    /* LOGIC */
    let currentUserUuid = null;
    let base64Image = null;

    const API_BASE = "/ui/users";

    const toggleStep = (step) => {
        document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
        document.getElementById(`step-${step}`).classList.add("active");

        document.getElementById("progress-fill").style.width =
            step === 1 ? "33%" :
            step === 2 ? "66%" : "100%";

        window.scrollTo(0, 0);
    };

    const showError = (msg) => {
        const banner = document.getElementById("error-banner");

        banner.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${msg}`;
        banner.style.display = "block";

        setTimeout(() => {
            banner.style.display = "none";
        }, 5000);
    };

    /* IMAGE PREVIEW */

    document.getElementById("fileInput").addEventListener("change", function (e) {

        const file = e.target.files[0];

        if (!file) return;

        if (file.size > 2 * 1024 * 1024) {
            showError("Image size too large (Max 2MB)");
            return;
        }

        const reader = new FileReader();

        reader.onload = function (event) {

            base64Image = event.target.result;

            document.getElementById("image-preview").innerHTML =
                `<img src="${base64Image}" style="width:100%;height:100%;object-fit:cover;">`;
        };

        reader.readAsDataURL(file);
    });

    /* STEP 1 */

    document.getElementById("form-create").onsubmit = async (e) => {

        e.preventDefault();

        try {

            const res = await fetch(API_BASE, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    username: document.getElementById("reg-username").value.trim(),

                    email: document.getElementById("reg-email").value.trim(),

                    phoneNumber: document.getElementById("reg-phone").value.trim()

                })

            });

            const data = await res.json();

            if (res.ok) {

                currentUserUuid = data.userUuid;

                toggleStep(2);

            } else {

                showError(data.message || "Username or Email already exists.");

            }

        } catch {

            showError("Server connection failed.");

        }

    };

    /* STEP 2 */

    document.getElementById("form-setup").onsubmit = async (e) => {

        e.preventDefault();

        try {

            const res = await fetch(`${API_BASE}/${currentUserUuid}/profile`, {

                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    firstName: document.getElementById("setup-fname").value,

                    lastName: document.getElementById("setup-lname").value,

                    bio: document.getElementById("setup-bio").value,

                    gender: document.getElementById("setup-gender").value,

                    dateOfBirth: document.getElementById("setup-dob").value,

                    country: document.getElementById("setup-country").value,

                    city: document.getElementById("setup-city").value,

                    profileImage: base64Image

                })

            });

            if (!res.ok) {

                showError("Failed to save profile. Check all fields.");

                return;

            }

            /* Get latest user */

            const latestUserResponse = await fetch(`${API_BASE}/${currentUserUuid}`);

            const latestUser = await latestUserResponse.json();

            renderCurrentProfile(latestUser);

            await loadAllDatabaseUsers();

            toggleStep(3);

        } catch (e) {

            console.error(e);

            showError("Error reaching the server.");

        }

    };

    /* PROFILE */

    const renderCurrentProfile = (user) => {

        console.log(user);

        document.getElementById("view-name").innerText =
            `${user.firstName || ""} ${user.lastName || ""}`;

        document.getElementById("view-handle").innerText =
            `@${user.username}`;

        document.getElementById("view-bio").innerText =
            user.bio || "No bio available.";

        const avatarDiv = document.getElementById("view-avatar");

        avatarDiv.innerHTML = "";

        if (user.profileImage &&
            user.profileImage !== "" &&
            user.profileImage !== "null") {

            const img = document.createElement("img");

            img.src = user.profileImage;

            img.alt = "Profile";

            img.style.width = "100%";
            img.style.height = "100%";
            img.style.objectFit = "cover";

            img.onerror = function () {

                avatarDiv.innerHTML =
                    `<i class="fa-solid fa-user" style="font-size:3.5rem;color:#cbd5e1;"></i>`;

            };

            avatarDiv.appendChild(img);

        } else {

            avatarDiv.innerHTML =
                `<i class="fa-solid fa-user" style="font-size:3.5rem;color:#cbd5e1;"></i>`;

        }

        document.getElementById("view-pills").innerHTML = `
            <div class="pill">
                <i class="fa-solid fa-location-dot"></i>
                ${user.city}, ${user.country}
            </div>

            <div class="pill">
                <i class="fa-solid fa-venus-mars"></i>
                ${user.gender}
            </div>

            <div class="pill">
                <i class="fa-solid fa-envelope"></i>
                ${user.email}
            </div>
        `;

    };

    /* COMMUNITY */

    async function loadAllDatabaseUsers() {

        try {

            const res = await fetch(`${API_BASE}/all`);

            const users = await res.json();

            const listContainer = document.getElementById("user-list");

            listContainer.innerHTML = "";

            users.forEach(u => {

                const card = document.createElement("div");

                card.className = "user-card";

                const imgSrc =
                    (u.profileImage && u.profileImage !== "")
                        ? u.profileImage
                        : `https://ui-avatars.com/api/?name=${encodeURIComponent(u.username)}`;

                card.innerHTML = `
                    <img src="${imgSrc}" alt="Profile">

                    <div style="font-weight:800;color:var(--dark);font-size:0.85rem;">
                        ${u.firstName || "New"} ${u.lastName || "User"}
                    </div>

                    <div style="font-size:0.75rem;color:var(--primary);font-weight:700;">
                        @${u.username}
                    </div>

                    <div style="font-size:0.7rem;color:var(--secondary);margin-top:4px;">
                        ${u.city || ""} ${u.country || "Unknown"}
                    </div>
                `;

                listContainer.appendChild(card);

            });

        } catch (e) {

            console.error("Could not load community members", e);

        }

    }

    /* DELETE */

    async function confirmDelete() {

        if (confirm("Permanently delete your account?")) {

            await fetch(`${API_BASE}/${currentUserUuid}`, {
                method: "DELETE"
            });

            location.reload();

        }

    }

</script>
</body>
</html>
