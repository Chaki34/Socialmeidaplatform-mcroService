<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialConnect Pro | Professional Social Network</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --accent: #f43f5e;
            --dark-bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-heavy: rgba(15, 23, 42, 0.8);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --nav-width: 260px;
            --story-gradient: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: var(--dark-bg);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
        }

        #canvas-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }

        /* --- LAYOUT --- */
        .app-container {
            display: flex;
            height: 100vh;
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
        }

        /* --- SIDEBAR (Desktop) --- */
        nav.sidebar {
            width: var(--nav-width);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(15px);
            z-index: 100;
        }

        .logo {
            font-weight: 800; font-size: 1.6rem; margin-bottom: 2.5rem;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 12px;
        }

        .nav-links { list-style: none; flex: 1; }
        .nav-item {
            padding: 0.8rem 1rem; margin-bottom: 0.4rem; border-radius: 12px;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center;
            gap: 15px; color: var(--text-dim); font-weight: 600;
        }
        .nav-item:hover, .nav-item.active { background: var(--glass); color: var(--text-main); }
        .nav-item.active i { color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }

        /* --- MAIN CONTENT --- */
        main.content-area {
            flex: 1; overflow-y: auto; scrollbar-width: none;
            padding: 2rem; display: flex; justify-content: center;
        }
        main.content-area::-webkit-scrollbar { display: none; }
        .feed-container { width: 100%; max-width: 650px; }

        /* --- STORIES --- */
        .stories-bar {
            display: flex; gap: 18px; padding-bottom: 2rem; overflow-x: auto; scrollbar-width: none;
        }
        .story-card { min-width: 75px; text-align: center; cursor: pointer; transition: 0.3s; }
        .story-card:hover { transform: scale(1.05); }
        .story-ring {
            width: 70px; height: 70px; border-radius: 50%; padding: 3px;
            background: var(--story-gradient); margin-bottom: 6px;
            transition: background 0.5s;
        }
        .story-ring.seen { background: var(--glass-border); }
        .story-ring img {
            width: 100%; height: 100%; border-radius: 50%;
            border: 3px solid var(--dark-bg); object-fit: cover;
        }
        .story-card span { font-size: 0.75rem; font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; }

        /* --- POSTS --- */
        .post-card {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 24px; margin-bottom: 2rem; overflow: hidden;
            backdrop-filter: blur(10px); animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- RIGHT SIDEBAR --- */
        .right-sidebar { width: 380px; padding: 2rem; overflow-y: auto; }
        .user-profile-card {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 1.5rem; margin-bottom: 2rem; text-align: center;
        }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--primary); margin: 0 auto 1rem; object-fit: cover; }
        .stats-row { display: flex; justify-content: space-around; margin-top: 1.5rem; border-top: 1px solid var(--glass-border); padding-top: 1rem; }
        .stat-item b { display: block; font-size: 1.1rem; }
        .stat-item span { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; }

        .profile-details-list { margin-top:15px; text-align:left; font-size:14px; line-height:28px; color: var(--text-main); }
        .profile-details-list i { width: 25px; color: var(--primary); }

        /* --- RESPONSIVE --- */
        @media (max-width: 1100px) { .right-sidebar { display: none; } }
        @media (max-width: 768px) {
            nav.sidebar {
                position: fixed; bottom: 0; left: 0; width: 100%; height: 70px;
                flex-direction: row; padding: 0; border-right: none; border-top: 1px solid var(--glass-border);
            }
            .nav-links { display: flex; justify-content: space-around; width: 100%; align-items: center; }
            .nav-item span, .logo { display: none; }
            main.content-area { padding: 1rem; padding-bottom: 80px; }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="app-container">
    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="logo"><i class="fa-solid fa-bolt"></i> ConnectPro</div>
        <ul class="nav-links">
            <li class="nav-item active"><i class="fa-solid fa-house"></i> <span>Feed</span></li>
            <li class="nav-item"><i class="fa-solid fa-compass"></i> <span>Explore</span></li>
            <li class="nav-item"><i class="fa-solid fa-clapperboard"></i> <span>Reels</span></li>
            <li class="nav-item"><i class="fa-solid fa-paper-plane"></i> <span>Messages</span></li>
            <li class="nav-item"><i class="fa-solid fa-heart"></i> <span>Notifications</span></li>
            <li class="nav-item"><i class="fa-solid fa-circle-user"></i> <span>Profile</span></li>
        </ul>
    </nav>

    <!-- Main Feed -->
    <main class="content-area">
        <div id="feed-section" class="feed-container">
            <!-- Stories -->
            <div class="stories-bar" id="story-list">
                <!-- Loaded by JS -->
            </div>

            <!-- Dynamic Post Feed -->
            <div id="posts-feed">
                <div class="post-card" style="padding:70px 30px;text-align:center;">
                    <i class="fa-regular fa-images" style="font-size:70px;color:#64748b;"></i>
                    <h2 style="margin-top:20px;">No Posts Available</h2>
                    <p style="margin-top:10px;color:var(--text-dim);">You haven't created any posts yet.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Right Sidebar -->
    <aside class="right-sidebar">
        <div class="user-profile-card">
            <img id="profile-image" class="profile-avatar" src="https://ui-avatars.com/api/?name=User" alt="Profile">

            <h2 id="profile-name">Loading...</h2>
            <p id="profile-username" style="color: var(--text-dim); font-size: 0.9rem;"></p>
            <p id="profile-bio" style="margin-top:1rem; font-size:0.85rem;"></p>

            <!-- Detailed Info Section -->
            <div class="profile-details-list">
                <div><i class="fa-solid fa-location-dot"></i> <span id="profile-location">-</span></div>
                <div><i class="fa-solid fa-earth-asia"></i> <span id="profile-country">-</span></div>
                <div><i class="fa-solid fa-user"></i> <span id="profile-gender">-</span></div>
                <div><i class="fa-solid fa-language"></i> <span id="profile-language">-</span></div>
                <div><i class="fa-solid fa-cake-candles"></i> <span id="profile-dob">-</span></div>
            </div>

            <div class="stats-row">
                <div class="stat-item"><b>0</b><span>Posts</span></div>
                <div class="stat-item"><b>0</b><span>Followers</span></div>
                <div class="stat-item"><b>0</b><span>Following</span></div>
            </div>
        </div>
    </aside>
</div>

<script>

    /* ==========================================================
       CONFIG
    ========================================================== */

    const API_BASE = "/ui/users";

    let currentUserUuid =
        localStorage.getItem("currentUserUuid");



    /* ==========================================================
       PROFILE IMAGE HANDLER
    ========================================================== */

    function getProfileImage(user) {


        if (
            !user.profileImage ||
            user.profileImage.trim() === ""
        ) {

            return `https://ui-avatars.com/api/?name=${encodeURIComponent(
                user.username || "User"
            )}&background=6366f1&color=fff`;

        }


        return user.profileImage;

    }




    /* ==========================================================
       LOAD CURRENT USER
    ========================================================== */

    async function loadCurrentUser() {


        if (!currentUserUuid) {


            console.error(
                "currentUserUuid missing from localStorage"
            );


            document
            .getElementById("profile-name")
            .innerText =
            "User not logged in";


            return;

        }



        try {


            const url =
            `${API_BASE}/${currentUserUuid}`;



            console.log(
                "Calling User API:",
                url
            );



            const response =
            await fetch(url);



            if (!response.ok) {


                throw new Error(
                    "User API failed : "
                    + response.status
                );

            }



            const user =
            await response.json();



            console.log(
                "USER RESPONSE:",
                user
            );



            updateProfile(user);



        }
        catch(error) {


            console.error(
                "PROFILE LOAD ERROR:",
                error
            );


        }


    }




    /* ==========================================================
       UPDATE PROFILE UI
    ========================================================== */

    function updateProfile(user) {



        const imageUrl =
        getProfileImage(user);




        /*
           Profile Image
        */

        const profileImg =
        document.getElementById(
            "profile-image"
        );



        if(profileImg){


            profileImg.src =
            imageUrl;



            profileImg.onerror =
            function(){


                this.src =
                `https://ui-avatars.com/api/?name=${
                    encodeURIComponent(
                        user.username || "User"
                    )
                }`;


            };


        }




        /*
           Story Image
        */

        const storyImg =
        document.getElementById(
            "my-story-image"
        );



        if(storyImg){


            storyImg.src =
            imageUrl;


        }






        /*
           User Basic Information
        */

        document
        .getElementById("profile-name")
        .innerText =

        `${user.firstName || ""} ${
            user.lastName || ""
        }`.trim() || "Unknown User";





        document
        .getElementById("profile-username")
        .innerText =

        user.username
        ?
        "@"+user.username
        :
        "";





        document
        .getElementById("profile-bio")
        .innerText =

        user.bio ||
        "No bio available";






        /*
           Additional Details
        */

        document
        .getElementById("profile-location")
        .innerText =

        user.city ||
        "-";



        document
        .getElementById("profile-country")
        .innerText =

        user.country ||
        "-";



        document
        .getElementById("profile-gender")
        .innerText =

        user.gender ||
        "-";



        document
        .getElementById("profile-language")
        .innerText =

        user.language ||
        "-";



        document
        .getElementById("profile-dob")
        .innerText =

        user.dateOfBirth ||
        "-";



    }







    /* ==========================================================
       STORIES
    ========================================================== */

    function renderStories() {


        const container =
        document.getElementById(
            "story-list"
        );



        container.innerHTML = `


        <div class="story-card">

            <div class="story-ring seen">

                <img
                id="my-story-image"
                src="https://ui-avatars.com/api/?name=User"
                alt="My Story">

            </div>

            <span>Your Story</span>

        </div>



        <div class="story-card">

            <div class="story-ring">

                <img src="https://i.pravatar.cc/150?u=1">

            </div>

            <span>sarah_design</span>

        </div>



        <div class="story-card">

            <div class="story-ring">

                <img src="https://i.pravatar.cc/150?u=2">

            </div>

            <span>mike_codes</span>

        </div>


        `;


    }







    /* ==========================================================
       PAGE LOAD
    ========================================================== */


    window.onload = function(){


        renderStories();


        loadCurrentUser();


    };








    /* ==========================================================
       THREE.JS BACKGROUND
    ========================================================== */


    const scene =
    new THREE.Scene();



    const camera =
    new THREE.PerspectiveCamera(
        75,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );



    const renderer =
    new THREE.WebGLRenderer({

        antialias:true,
        alpha:true

    });



    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );



    document
    .getElementById(
        "canvas-container"
    )
    .appendChild(
        renderer.domElement
    );




    const particlesGeometry =
    new THREE.BufferGeometry();



    const posArr =
    new Float32Array(
        1500 * 3
    );



    for(
        let i=0;
        i<4500;
        i++
    ){

        posArr[i] =
        (Math.random()-0.5)*10;

    }



    particlesGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            posArr,
            3
        )
    );



    const material =
    new THREE.PointsMaterial({

        size:0.015,
        color:0x6366f1

    });



    const particlesMesh =
    new THREE.Points(
        particlesGeometry,
        material
    );



    scene.add(
        particlesMesh
    );



    camera.position.z = 5;




    function animate(){


        requestAnimationFrame(
            animate
        );


        particlesMesh.rotation.y +=0.001;


        renderer.render(
            scene,
            camera
        );


    }


    animate();




    window.addEventListener(
        "resize",
        ()=>{


            camera.aspect =
            window.innerWidth /
            window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );


        }
    );


</script>

</body>
</html>
